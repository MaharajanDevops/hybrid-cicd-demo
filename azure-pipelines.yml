# azure-pipelines.yml  — only the pool lines change
trigger: none

pool:
  name: MyLocalAgent          # ← changed

variables:
  stagingApp: 'app-cicd-staging-maharajan'
  prodApp:    'app-cicd-prod-maharajan'
  serviceConn: 'Azure-Service-Connection'

stages:

- stage: DeployStaging
  displayName: '🌍 Deploy to Staging'
  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy HTML to Staging'
    environment: 'staging'
    pool:
      name: MyLocalAgent      # ← changed
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureWebApp@1
            displayName: 'Deploy to Staging App Service'
            inputs:
              azureSubscription: $(serviceConn)
              appType: 'webApp'
              appName: $(stagingApp)
              package: '$(System.DefaultWorkingDirectory)'

- stage: DeployProd
  displayName: '🚀 Deploy to Production'
  dependsOn: DeployStaging
  jobs:
  - deployment: DeployProd
    displayName: 'Deploy HTML to Production'
    environment: 'production'
    pool:
      name: MyLocalAgent      # ← changed
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureWebApp@1
            displayName: 'Deploy to Production App Service'
            inputs:
              azureSubscription: $(serviceConn)
              appType: 'webApp'
              appName: $(prodApp)
              package: '$(System.DefaultWorkingDirectory)'