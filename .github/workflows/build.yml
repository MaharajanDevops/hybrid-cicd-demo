name: CI — Build & Trigger CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-trigger:
    name: '⚡ Build & Trigger Azure Pipeline'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate HTML
      run: |
        echo "✅ Checking HTML file exists..."
        ls -la index.html
        echo "✅ HTML validation passed!"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: html-app-${{ github.run_number }}
        path: index.html

    - name: Trigger Azure Pipeline
      run: |
        echo "🔔 Triggering Azure Pipeline..."

        # Debug — print values so we can see what's being used
        echo "ORG      : $AZURE_DEVOPS_ORG"
        echo "PROJECT  : $AZURE_DEVOPS_PROJECT"
        echo "PIPELINE : $AZURE_DEVOPS_PIPELINE_ID"

        # Build the URL explicitly
        API_URL="https://dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_apis/pipelines/${AZURE_DEVOPS_PIPELINE_ID}/runs?api-version=7.1"
        echo "API URL  : $API_URL"

        # Build auth header
        B64_PAT=$(printf ":%s" "$AZURE_DEVOPS_TOKEN" | base64 -w 0)

        # Call the API — -o and -w at the end (correct order)
        HTTP_CODE=$(curl -s -X POST "$API_URL" \
          -H "Authorization: Basic $B64_PAT" \
          -H "Content-Type: application/json" \
          -d '{
            "resources": {
              "repositories": {
                "self": {
                  "refName": "refs/heads/main"
                }
              }
            }
          }' \
          -o response.json \
          -w "%{http_code}")

        echo "Response Body:"
        cat response.json
        echo ""
        echo "HTTP Code: $HTTP_CODE"

        if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "201" ]]; then
          echo "✅ Azure Pipeline triggered successfully!"
        else
          echo "❌ Failed. Check the response body above."
          exit 1
        fi
      env:
        AZURE_DEVOPS_ORG:         ${{ secrets.AZURE_DEVOPS_ORG }}
        AZURE_DEVOPS_PROJECT:     ${{ secrets.AZURE_DEVOPS_PROJECT }}
        AZURE_DEVOPS_PIPELINE_ID: ${{ secrets.AZURE_DEVOPS_PIPELINE_ID }}
        AZURE_DEVOPS_TOKEN:       ${{ secrets.AZURE_DEVOPS_TOKEN }}